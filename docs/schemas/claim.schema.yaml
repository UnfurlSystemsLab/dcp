schema_id: dcp.claim
schema_version: 0.2.0-draft
owning_spec: ../specs/DCP-CLAIM.md
description: Plane 1 component self-description.

required:
  - identity
  - domain
  - refusals
  - dependencies
  - offers
  - conflict_resolution
  - faults
  - metadata

properties:
  identity:
    required: [uri, name, kind, version, publisher]
    properties:
      uri: { type: uri, stable: true }
      name: { type: string }
      kind:
        type: enum
        values: [intelligent_component, component, infrastructure]
      version: { type: semver }
      publisher: { type: string }
      publisher_uri: { type: uri, required: false }

  domain:
    required: [summary, concerns, boundary_principles]
    properties:
      summary: { type: string }
      concerns:
        type: list
        min_items: 1
        item:
          required: [concern, description]
          properties:
            concern: { type: string, format: kebab-case, unique_within: domain.concerns }
            description: { type: string }
            scope_notes: { type: string, required: false }
            owns_state:
              type: list
              required: false
              item:
                required: [resource, description, sensitivity]
                properties:
                  resource: { type: string }
                  description: { type: string }
                  sensitivity:
                    type: enum
                    values: [public, internal, confidential, secret]
            owns_decisions:
              type: list
              required: false
              item:
                required: [decision, description, authority]
                properties:
                  decision: { type: string, format: kebab-case }
                  description: { type: string }
                  authority:
                    type: enum
                    values: [exclusive, consulted, advisory]
      boundary_principles:
        type: list
        min_items: 1
        item: { type: string }

  refusals:
    type: list
    min_items: 1
    item:
      required: [concern, rationale]
      properties:
        concern: { type: string }
        rationale: { type: string }
        owned_by: { type: string, required: false }

  dependencies:
    required: [required, recommended, forbidden]
    properties:
      required:
        type: list
        item:
          required: [need, description, accepted_providers]
          properties:
            need: { type: string, format: kebab-case }
            description: { type: string }
            accepted_providers:
              type: list
              min_items: 1
      recommended: { type: list }
      forbidden: { type: list }

  offers:
    type: list
    item:
      required: [capability, description, consumer_access, interface, stability, version]
      properties:
        capability:
          type: string
          format: kebab-case
          unique_within: offers
          reserved: [registrations]   # the DCP HTTP binding's GET <service_root>/dcp/registrations (HLD-C2 G.3)
        description: { type: string }
        consumer_access:
          type: enum
          values: [any, named_components_only]
        interface:
          required: [kind, details]
          properties:
            kind:
              type: enum
              values: [http_api, event_stream, negotiation, in_process, external_protocol]
              # external_protocol: reached over the provider's own standard protocol (details.protocol required),
              # never through the DCP invocation envelope; it carries no documentation (HLD-C2 A.6)
            details: { type: map }
        stability:
          type: enum
          values: [experimental, evolving, stable, deprecated]
        version: { type: semver }
        cost_implications: { type: string, required: false }
        documentation:
          required_when: the offer is documented (DCP Documentation §3)
          description: Invocation payload schemas for generated documentation; never matched by the resolver.
          required: [operations]
          properties:
            summary: { type: string, required: false }
            operations:
              type: list
              min_items: 1
              item:
                required: [operation, request_schema, response_schema]
                properties:
                  operation: { type: string, unique_within: documentation.operations, description: The exact invocation.operation value. }
                  summary: { type: string, required: false }
                  request_schema: { type: ref, ref: "#/definitions/artifact_ref", media_type: application/schema+json, root_type: object }
                  response_schema: { type: ref, ref: "#/definitions/artifact_ref", media_type: application/schema+json, root_type: object }
          rules:
            - schemas describe input/output of one operation; the envelope's invocation.operation selects the operation
            - a single operation that branches on an input field expresses it as a oneOf with mutually exclusive branches

  conflict_resolution:
    required: [overlapping_concerns, precedence_rules, requires_human_escalation]

  negotiation_surface:
    required_when: identity.kind == intelligent_component

  integration_ports:
    required: false

  child_claims:
    type: list
    required: false
    description: References to child claims for DCP aggregation.

  faults:
    type: list

  metadata:
    required: [dcp_version, claim_version]

  api_documents:
    type: list
    required: false
    description: OpenAPI documents for the component's product HTTP routes (not DCP invocations).
    item:
      required: [api_id, description, openapi, surfaces]
      properties:
        api_id: { type: string, format: kebab-case, unique_within: api_documents }
        description: { type: string }
        openapi:
          type: ref
          ref: "#/definitions/artifact_ref"
          media_type: [application/vnd.oai.openapi+json, application/vnd.oai.openapi+yaml]
        surfaces:
          type: list
          min_items: 1
          item: { type: string, format: kebab-case }
    rules:
      - every operation carries x-dcp-surface naming one of surfaces
      - every operation carries x-dcp-access, public or protected (no default); x-dcp-permission is optional
      - no path starts with /dcp/
      - no servers, security or components.securitySchemes
      - every $ref targets the document's own #/components/<section>/<name>
      - no two api_documents of one claim declare the same method and path (API_DOCUMENT_PATH_CONFLICT)
      - path-level members other than parameters that several documents declare for one path are identical after component renaming (API_DOCUMENT_PATH_CONFLICT)

definitions:
  artifact_ref:
    description: One file inside the artifact that carries the claim, pinned by content hash.
    required: [path, media_type, sha256]
    properties:
      path:
        type: string
        format: relative-artifact-path
        rules:
          - not absolute, not empty, no URI scheme
          - no "..", no "\\", no empty segments
      media_type:
        type: enum
        values: [application/schema+json, application/vnd.oai.openapi+json, application/vnd.oai.openapi+yaml]
      sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
    rules:
      - readers verify sha256 against the file bytes before use; mismatch or missing file is a validation failure
      - JSON Schema documents use draft 2020-12; OpenAPI documents use 3.1.0; both are self-contained
      - JSON Schema $ref values are JSON Pointer fragments ("#" or "#/..."); $id, $anchor, $dynamicRef, $dynamicAnchor and $recursiveRef are not allowed
